<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scorsaire — bloc-notes, éditeur</title>
<style>
  html,body{height:100%}
  html{--md-sys-color-surface:#fff;--md-sys-color-on-surface:#1c1b1f}
  @media (prefers-color-scheme:dark){html{--md-sys-color-surface:#1c1b1f;--md-sys-color-on-surface:#e6e1e5;--md-sys-color-surface-container:#2b2930;--md-sys-color-outline:#938f99;--md-sys-color-outline-variant:#49454f;--md-sys-color-primary:#d0bcff;--md-sys-color-on-primary:#381e72;--md-sys-color-on-surface-variant:#cac4d0;background:#121212;color:#e6e1e5}}
  body{margin:0;font-family:system-ui,sans-serif}
  body :is(div,button,p){font-family:Comic Sans MS,cursive !important}
  #debug{position:fixed;left:.5rem;bottom:.5rem;z-index:50;max-width:60vw;font:.75rem monospace;background:#000c;color:#fff;padding:.25rem .5rem;border-radius:.25rem}
</style>
</head>
<body>
<scorsaire-note id="n" mode="edit" lang="fr" fullscreen></scorsaire-note>
<div id="debug" hidden></div>
<script type="module">
  import './scorsaire-note-edit.js';
  const el = document.getElementById('n');
  // `?debug`: the last events at the bottom left, and `?sound=single|light` to compare the sounds; nothing of that is part of the component
  const q = new URLSearchParams(location.search);
  if (q.get('sound')) el.setAttribute('sound-mode', q.get('sound'));
  if (q.has('debug')) {
    const d = document.getElementById('debug'); d.hidden = false;
    const set = (t) => { d.textContent = t; };
    el.addEventListener('change', (e) => set('change : ' + e.detail.value.length + ' octets'));
    el.addEventListener('save', (e) => set('save : ' + e.detail.value.length + ' octets'));
    el.addEventListener('prefschange', (e) => set('prefs : ' + JSON.stringify(e.detail)));
  }
</script>
</body>
</html>
